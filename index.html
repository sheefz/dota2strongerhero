<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Hero Matchup Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid #3a3a5a;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0a0c0;
        }
        
        .matchup-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .hero-card {
            flex: 1;
            background: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            border: 2px solid #3a3a5a;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .hero-card.winner {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: scale(1.02);
        }
        
        .hero-card h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffd700;
        }
        
        .hero-name {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .vs {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: #ff5555;
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.5);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to bottom, #4a4a8a, #2a2a5a);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #5a5a9a;
        }
        
        button:hover {
            background: linear-gradient(to bottom, #5a5a9a, #3a3a7a);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .win-button {
            background: linear-gradient(to bottom, #5a9a4a, #3a7a2a);
            border: 1px solid #7aba5a;
        }
        
        .win-button:hover {
            background: linear-gradient(to bottom, #6aaa5a, #4a8a3a);
        }
        
        .history {
            background: rgba(20, 20, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid #3a3a5a;
        }
        
        .history h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #ffd700;
            text-align: center;
        }
        
        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #3a3a5a;
            display: flex;
            justify-content: space-between;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .winner-name {
            color: #5a9a4a;
            font-weight: bold;
        }
        
        .loser-name {
            color: #ff5555;
            text-decoration: line-through;
        }
        
        @media (max-width: 768px) {
            .matchup-container {
                flex-direction: column;
            }
            
            .vs {
                margin: 20px 0;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dota 2 Hero Matchup Selector</h1>
            <p class="subtitle">Choose which hero wins. The loser gets replaced by a new random hero.</p>
        </header>
        
        <div class="matchup-container">
            <div class="hero-card" id="left-hero">
                <h2>Hero 1</h2>
                <div class="hero-name" id="left-hero-name">Loading...</div>
                <button class="win-button" onclick="selectWinner('left')">This Hero Wins</button>
            </div>
            
            <div class="vs">VS</div>
            
            <div class="hero-card" id="right-hero">
                <h2>Hero 2</h2>
                <div class="hero-name" id="right-hero-name">Loading...</div>
                <button class="win-button" onclick="selectWinner('right')">This Hero Wins</button>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="newMatchup()">New Random Matchup</button>
            <button onclick="resetHistory()">Reset History</button>
        </div>
        
        <div class="history">
            <h3>Match History</h3>
            <div class="history-list" id="history-list">
                <!-- History items will be added here -->
            </div>
        </div>
    </div>

    <script>
        // Dota 2 heroes list from patch 7.39d
        const heroes = [
            "Lion", "Pudge", "Earthshaker", "Slark", "Sven", "Chaos Knight", "Zeus", "Rubick",
            "Earth Spirit", "Clockwerk", "Windranger", "Tusk", "Phantom Assassin", "Bounty Hunter", 
            "Riki", "Jakiro", "Wraith King", "Lina", "Kunkka", "Anti-Mage", "Spectre", "Phoenix", 
            "Ogre Magi", "Underlord", "Treant Protector", "Vengeful Spirit", "Weaver", "Crystal Maiden",
            "Grimstroke", "Techies", "Dark Willow", "Mars", "Meepo", "Axe", "Leshrac", "Necrophos",
            "Shadow Fiend", "Huskar", "Brewmaster", "Night Stalker", "Tiny", "Io", "Snapfire", "Dark Seer",
            "Gyrocopter", "Dawnbreaker", "Templar Assassin", "Winter Wyvern", "Oracle", "Ember Spirit",
            "Puck", "Batrider", "Magnus", "Alchemist", "Drow Ranger", "Legion Commander", "Shadow Shaman",
            "Storm Spirit", "Lycan", "Tidehunter", "Pangolier", "Monkey King", "Elder Titan", "Visage",
            "Invoker", "Faceless Void", "Lifestealer", "Morphling", "Outworld Destroyer", "Timbersaw",
            "Beastmaster", "Bristleback", "Enchantress", "Undying", "Death Prophet", "Arc Warden",
            "Chen", "Tinker", "Razor", "Clinkz", "Disruptor", "Naga Siren", "Abaddon", "Enigma",
            "Spirit Breaker", "Sand King", "Skywrath Mage", "Viper", "Medusa", "Lone Druid",
            "Terrorblade", "Bloodseeker", "Nyx Assassin", "Doom", "Shadow Demon", "Silencer",
            "Warlock", "Queen of Pain", "Omniknight", "Slardar", "Ancient Apparition", "Mirana",
            "Venomancer", "Troll Warlord", "Broodmother", "Dragon Knight", "Marci", "Primal Beast",
            "Muerta", "Hoodwink", "Pugna"
        ];

        let currentLeftHero, currentRightHero;
        let matchHistory = [];
        let lastMatchup = { left: null, right: null };

        // Initialize the page
        function init() {
            newMatchup();
        }

        // Generate a new random matchup
        function newMatchup() {
            // Remove winner highlighting
            document.getElementById('left-hero').classList.remove('winner');
            document.getElementById('right-hero').classList.remove('winner');
            
            // Get a new hero for the left side
            let leftOptions = heroes.filter(hero => 
                hero !== currentRightHero && // Can't be the same as the current right hero
                hero !== lastMatchup.left // Can't be the same as the last left hero in this matchup
            );
            currentLeftHero = leftOptions[Math.floor(Math.random() * leftOptions.length)];
            
            // Get a new hero for the right side
            let rightOptions = heroes.filter(hero => 
                hero !== currentLeftHero && // Can't be the same as the current left hero
                hero !== lastMatchup.right // Can't be the same as the last right hero in this matchup
            );
            currentRightHero = rightOptions[Math.floor(Math.random() * rightOptions.length)];
            
            // Update the display
            document.getElementById('left-hero-name').textContent = currentLeftHero;
            document.getElementById('right-hero-name').textContent = currentRightHero;
            
            // Update last matchup
            lastMatchup = { left: currentLeftHero, right: currentRightHero };
        }

        // Select the winner
        function selectWinner(winnerSide) {
            const winner = winnerSide === 'left' ? currentLeftHero : currentRightHero;
            const loser = winnerSide === 'left' ? currentRightHero : currentLeftHero;
            
            // Highlight the winner
            document.getElementById('left-hero').classList.remove('winner');
            document.getElementById('right-hero').classList.remove('winner');
            document.getElementById(`${winnerSide}-hero`).classList.add('winner');
            
            // Add to history
            matchHistory.unshift({
                winner: winner,
                loser: loser,
                timestamp: new Date().toLocaleTimeString()
            });
            
            // Update history display
            updateHistory();
            
            // Replace the loser with a new hero after a short delay
            setTimeout(() => {
                if (winnerSide === 'left') {
                    // Replace the right hero
                    let options = heroes.filter(hero => 
                        hero !== currentLeftHero && // Can't be the same as the current left hero
                        hero !== lastMatchup.right // Can't be the same as the last right hero in this matchup
                    );
                    currentRightHero = options[Math.floor(Math.random() * options.length)];
                    document.getElementById('right-hero-name').textContent = currentRightHero;
                } else {
                    // Replace the left hero
                    let options = heroes.filter(hero => 
                        hero !== currentRightHero && // Can't be the same as the current right hero
                        hero !== lastMatchup.left // Can't be the same as the last left hero in this matchup
                    );
                    currentLeftHero = options[Math.floor(Math.random() * options.length)];
                    document.getElementById('left-hero-name').textContent = currentLeftHero;
                }
                
                // Update last matchup
                lastMatchup = { left: currentLeftHero, right: currentRightHero };
                
                // Remove winner highlighting after replacement
                setTimeout(() => {
                    document.getElementById('left-hero').classList.remove('winner');
                    document.getElementById('right-hero').classList.remove('winner');
                }, 1000);
            }, 1500);
        }

        // Update the match history display
        function updateHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            // Show only the last 10 matches
            const recentHistory = matchHistory.slice(0, 10);
            
            recentHistory.forEach(match => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <span class="winner-name">${match.winner}</span> 
                    defeated 
                    <span class="loser-name">${match.loser}</span>
                    <span>${match.timestamp}</span>
                `;
                historyList.appendChild(historyItem);
            });
        }

        // Reset the match history
        function resetHistory() {
            matchHistory = [];
            updateHistory();
        }

        // Initialize the page when it loads
        window.onload = init;
    </script>
</body>
</html>
